# Host-specific dispatch settings for shared harness commands/skills/agents.
# Procedure (dual critic → confirm → fix, TRACK, §4 report) is host-invariant.
# Pins, tool names, and agent types are NOT — resolve from this file.
#
# Detection (orchestrator):
#   cursor — Cursor IDE / Cloud Agent with Task tool
#   grok   — Grok Build TUI/CLI (spawn_subagent; no Cursor Task)
#   claude — Claude Code / claude-config host
# When ambiguous: prefer tools present (Task → cursor; spawn_subagent only → grok).
#
# Fleet SSOT: Claude/.cursor-plugin/dispatch-settings.yaml (sync via sync-harness).
# This file is the repo mirror loaded when working in Murmur.

version: 1

hosts:
  cursor:
    dispatch_tool: Task
    critic:
      subagent_type: session-auditor
      # Escape hatch when native type missing from Task enum:
      escape_type: generalPurpose
      prompt_from: .cursor/agents/session-auditor.md
      model: composer-2.5-fast
      model_policy: pin_required
      readonly: true
    adjudicator:
      subagent_type: audit-verifier
      escape_type: generalPurpose
      prompt_from: .cursor/agents/audit-verifier.md
      # omit = inherit parent; optional pin only per orchestration omit-first rules
      model: omit
      model_optional: cursor-grok-4.5-high
      model_policy: omit_first
      allow_models: [omit, cursor-grok-4.5-high]
      deny_models: [composer-2.5, composer-2.5-fast, k3]
      confirm_readonly: true
      # fix: writable Task (no readonly)
    notes: |
      Enforced by task_model_allowlist hook when present.
      Never bare grok-4.5-* or Grok *-fast on Cursor Task.
    iterate:
      dispatch_tool: Task
      subagent_type: iterate
      escape_type: generalPurpose
      prompt_from: .cursor/agents/iterate.md
      model: omit
      model_policy: omit_always
      readonly: false

  grok:
    dispatch_tool: spawn_subagent
    critic:
      # No native session-auditor in Grok enum yet — use general-purpose + agent md
      subagent_type: general-purpose
      escape_type: general-purpose
      prompt_from: .cursor/agents/session-auditor.md
      # HARD: omit — let Grok harness / config.toml / parent session decide.
      # Do not pin grok-composer-*, grok-4.5, cursor-*, or composer-*.
      model: omit
      model_policy: omit_always
      capability_mode: read-only
    adjudicator:
      subagent_type: general-purpose
      escape_type: general-purpose
      prompt_from: .cursor/agents/audit-verifier.md
      model: omit
      model_policy: omit_always
      allow_models: [omit]
      confirm_capability_mode: read-only
      fix_capability_mode: all
    notes: |
      Grok runs harness defaults only. Parent model (often grok-4.5 via
      subagents.models / session) applies when model is omitted.
      Do not import Cursor pin tables into Grok dispatches.
    iterate:
      dispatch_tool: spawn_subagent
      subagent_type: general-purpose
      escape_type: general-purpose
      prompt_from: .cursor/agents/iterate.md
      model: omit
      model_policy: omit_always
      capability_mode: all
      readonly: false

  claude:
    dispatch_tool: Agent
    critic:
      subagent_type: general-purpose
      prompt_from: .cursor/agents/session-auditor.md
      model: omit
      model_policy: omit_always
      # Claude Code: prefer readonly tools / no writes in critic prompt
    adjudicator:
      subagent_type: general-purpose
      prompt_from: .cursor/agents/audit-verifier.md
      model: omit
      model_policy: omit_always
    notes: |
      Stub — refine when Claude host is primary for these commands.
      Default is omit (Claude subscription routing), not Cursor slugs.
    iterate:
      dispatch_tool: Agent
      subagent_type: general-purpose
      prompt_from: .cursor/agents/iterate.md
      model: omit
      model_policy: omit_always
      readonly: false
